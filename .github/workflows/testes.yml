name: Testes

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    name: Sincronia do vault
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      # Os testes de sincronia criam commits em repositórios temporários.
      - name: Configurar identidade do git
        run: |
          git config --global user.name  "CI"
          git config --global user.email "ci@bvba-qa.local"

      - name: Rodar a bateria completa
        run: ./scripts/testes/rodar.sh
