name: Publicar drop

# Publicacao autonoma do drop: ninguem precisa estar no computador as 20h.
#
# O cron da GitHub Actions nao e pontual (a fila costuma atrasar alguns
# minutos), entao disparamos com folga -- 22:40 UTC = 19:40 em Brasilia -- e o
# proprio agente espera ate 20:00:00 em ponto antes de publicar. Se o runner
# demorar e so subir depois das 20h, ele publica assim que acordar, desde que
# dentro da tolerancia.
#
# O gatilho e diario, mas so age no dia do drop: defina a variavel de
# repositorio DROP_DATA (Settings > Secrets and variables > Actions >
# Variables) como AAAA-MM-DD. Nos outros dias o job encerra sem fazer nada.

on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      horario:
        description: "Horario de publicacao (America/Sao_Paulo), ex.: 20:00"
        required: false
        default: "20:00"
      tolerancia:
        description: "Atraso maximo aceitavel, em minutos"
        required: false
        default: "120"
      simular:
        description: "So mostra o status, sem publicar"
        type: boolean
        required: false
        default: false

concurrency:
  # Duas execucoes publicando ao mesmo tempo nao ajudam ninguem.
  group: publicar-drop
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Precisa cobrir a espera ate as 20h mais a publicacao em si.
    timeout-minutes: 120

    env:
      NUVEMSHOP_STORE_ID: ${{ secrets.NUVEMSHOP_STORE_ID }}
      NUVEMSHOP_ACCESS_TOKEN: ${{ secrets.NUVEMSHOP_ACCESS_TOKEN }}
      NUVEMSHOP_USER_AGENT: ${{ secrets.NUVEMSHOP_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Hoje e dia de drop?
        id: decisao
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          DATA="${{ vars.DROP_DATA }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Execucao manual: seguindo."
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATA" ]; then
            echo "DROP_DATA nao definida: seguindo (o agente decide pelo estado)."
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          elif [ "$DATA" = "$HOJE" ]; then
            echo "Hoje ($HOJE) e o dia do drop. Seguindo."
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hoje ($HOJE) nao e o dia do drop ($DATA). Nada a fazer."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.decisao.outputs.rodar == 'true'
        with:
          python-version: "3.11"

      - name: Conferir credenciais
        if: steps.decisao.outputs.rodar == 'true'
        run: python -m agente_drop conferir

      - name: Status antes de publicar
        if: steps.decisao.outputs.rodar == 'true'
        run: python -m agente_drop status

      - name: Calcular o horario alvo de hoje
        id: alvo
        if: steps.decisao.outputs.rodar == 'true'
        run: |
          # Data explicita (e nao so "20:00") para que um runner atrasado
          # publique hoje mesmo, em vez de reagendar para amanha.
          HORA="${{ github.event.inputs.horario || '20:00' }}"
          DIA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          echo "quando=$DIA $HORA" >> "$GITHUB_OUTPUT"
          echo "Alvo: $DIA $HORA (America/Sao_Paulo)"

      - name: Publicar
        if: steps.decisao.outputs.rodar == 'true' && github.event.inputs.simular != 'true'
        run: |
          python -m agente_drop publicar \
            --as "${{ steps.alvo.outputs.quando }}" \
            --tolerancia "${{ github.event.inputs.tolerancia || '120' }}"

      - name: Status depois de publicar
        if: always() && steps.decisao.outputs.rodar == 'true'
        run: python -m agente_drop status || true

      - name: Guardar o estado atualizado
        if: always() && steps.decisao.outputs.rodar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: estado-drop
          path: .estado_drop.json
          if-no-files-found: warn
