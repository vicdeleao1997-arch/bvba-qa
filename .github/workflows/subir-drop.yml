name: Subir drop (rascunho)

# Sobe o catalogo para a Nuvemshop COMO RASCUNHO, rodando dentro do GitHub.
#
# A vantagem sobre rodar na maquina: o token nunca sai do cofre de secrets do
# repositorio. Ninguem precisa colar credencial em lugar nenhum -- basta
# cadastrar os secrets uma vez e apertar "Run workflow".
#
# Este workflow nao publica nada. Quem publica e o publicar-drop.yml, as 20h.

on:
  workflow_dispatch:
    inputs:
      catalogo:
        description: "Arquivo do catalogo"
        required: false
        default: "catalogo/produtos.csv"
      simular:
        description: "So mostra o plano, sem escrever na loja"
        type: boolean
        required: false
        default: true
      forcar:
        description: "Reenviar tudo, mesmo o que nao mudou"
        type: boolean
        required: false
        default: false

concurrency:
  group: subir-drop
  cancel-in-progress: false

permissions:
  # Necessario para comitar o .estado_drop.json de volta -- e por ele que a
  # publicacao das 20h sabe quais produtos existem.
  contents: write

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NUVEMSHOP_STORE_ID: ${{ secrets.NUVEMSHOP_STORE_ID }}
      NUVEMSHOP_ACCESS_TOKEN: ${{ secrets.NUVEMSHOP_ACCESS_TOKEN }}
      NUVEMSHOP_USER_AGENT: ${{ secrets.NUVEMSHOP_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar o catalogo
        run: python -m agente_drop validar --catalogo "${{ inputs.catalogo }}"

      - name: Conferir credenciais
        run: python -m agente_drop conferir

      - name: Plano
        run: python -m agente_drop plano --catalogo "${{ inputs.catalogo }}"

      - name: Subir como rascunho
        if: ${{ inputs.simular != true }}
        run: |
          python -m agente_drop subir \
            --catalogo "${{ inputs.catalogo }}" \
            --aplicar ${{ inputs.forcar == true && '--forcar' || '' }}

      - name: Conferir que nada foi publicado
        if: ${{ inputs.simular != true }}
        run: |
          # Rede de seguranca: o drop so pode ir ao ar as 20h, pelo outro
          # workflow. Se algo aparecer publicado aqui, o job falha.
          python -m agente_drop status | tee /tmp/status.txt
          if grep -q "^  PUBLICADO" /tmp/status.txt; then
            echo "::error::Ha produto publicado depois do upload. Isso nao deveria acontecer."
            exit 1
          fi

      - name: Guardar o estado no repositorio
        if: ${{ inputs.simular != true }}
        run: |
          if [ ! -f .estado_drop.json ]; then
            echo "Sem estado para comitar."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .estado_drop.json
          if git diff --cached --quiet; then
            echo "Estado sem mudanca."; exit 0
          fi
          git commit -m "Atualiza o estado do drop apos subir os rascunhos"
          git push origin HEAD:${{ github.ref_name }}

      - name: Guardar o relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-drop
          path: relatorios/
          if-no-files-found: ignore
